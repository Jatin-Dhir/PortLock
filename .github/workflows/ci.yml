name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned linter
        run: python -m pip install "ruff==0.17.5"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PortLock with its development tools
        run: python -m pip install -e ".[dev]"
      # No test in this suite calls an enforcement mechanism or changes a system
      # setting; see "Testing rules" in docs/DESIGN.md.
      - run: python -m pytest
